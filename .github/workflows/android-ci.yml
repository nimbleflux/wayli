name: Android CI

# CI quality gate for the Android app. Runs lint + test + build on PRs and pushes
# that touch android/ files. Uses dorny/paths-filter so only relevant jobs run.
#
# Publishing is handled by the main release.yml workflow (publish_android toggle).

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      source: ${{ steps.filter.outputs.source }}
      ci-config: ${{ steps.filter.outputs.ci-config }}
      any: ${{ steps.filter.outputs.any }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            source:
              - 'android/app/src/**'
              - 'android/core/src/**'
              - 'android/data/src/**'
              - 'android/gps-engine/src/**'
              - 'android/sensors/src/**'
              - 'android/**/build.gradle.kts'
              - 'android/gradle/**'
            ci-config:
              - '.github/workflows/android-ci.yml'
            any:
              - 'android/**'
              - '.github/workflows/android-ci.yml'

  build:
    name: Build & Test
    needs: changes
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.source == 'true' ||
      needs.changes.outputs.ci-config == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # fluxbase-kotlin resolves from GitHub Packages; settings.gradle.kts
      # reads GITHUB_ACTOR/GITHUB_TOKEN from the environment.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Unit tests
        working-directory: android
        run: ./gradlew test

      - name: Build gplay debug APK
        working-directory: android
        run: ./gradlew :app:assembleGplayDebug

      - name: Build foss debug APK
        working-directory: android
        run: ./gradlew :app:assembleFossDebug

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apks
          path: |
            android/app/build/outputs/apk/gplay/debug/*.apk
            android/app/build/outputs/apk/foss/debug/*.apk
