name: Android CI

# CI quality gate for the Android app. Runs lint + test + build on PRs and pushes
# that touch android/ files. Uses dorny/paths-filter so only relevant jobs run.
#
# Publishing is handled by the main release.yml workflow (publish_android toggle).

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      source: ${{ steps.filter.outputs.source }}
      ci-config: ${{ steps.filter.outputs.ci-config }}
      any: ${{ steps.filter.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            source:
              - 'android/app/src/**'
              - 'android/core/src/**'
              - 'android/data/src/**'
              - 'android/gps-engine/src/**'
              - 'android/sensors/src/**'
              - 'android/**/build.gradle.kts'
              - 'android/gradle/**'
            ci-config:
              - '.github/workflows/android-ci.yml'
            any:
              - 'android/**'
              - '.github/workflows/android-ci.yml'

  build:
    name: Build & Test
    needs: changes
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.source == 'true' ||
      needs.changes.outputs.ci-config == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # fluxbase-kotlin resolves from GitHub Packages; settings.gradle.kts
      # reads GITHUB_ACTOR/GITHUB_TOKEN from the environment.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Unit tests
        working-directory: android
        run: ./gradlew test

      - name: Build gplay debug APK
        working-directory: android
        run: ./gradlew :app:assembleGplayDebug

      - name: Build foss debug APK
        working-directory: android
        run: ./gradlew :app:assembleFossDebug

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apks
          path: |
            android/app/build/outputs/apk/gplay/debug/*.apk
            android/app/build/outputs/apk/foss/debug/*.apk
