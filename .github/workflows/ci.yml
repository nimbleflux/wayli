name: CI

on:
  # Only run on direct pushes to main (post-merge verification). All PR
  # activity — including pushes to PR branches — is covered by the
  # `pull_request` trigger below. Triggering `push` on every branch too causes
  # a duplicate run for every PR push (push event + PR synchronize event),
  # which doubles CI load and, for the flaky docker-compose smoke job, doubles
  # the chance of a spurious failure blocking the PR.
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on PRs; serialize runs per ref on push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
          cache: true
          cache-cancel-in-progress: ${{ github.event_name == 'pull_request' }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and lint
        run: bun run lint

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
          cache: true
          cache-cancel-in-progress: ${{ github.event_name == 'pull_request' }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare SvelteKit
        run: bunx svelte-kit sync

      # Runs unit tests AND collects coverage. Coverage is generated for
      # visibility only — it is uploaded as an artifact below but does NOT
      # fail this job (thresholds remain advisory until coverage is raised).
      - name: Run unit tests with coverage (report-only)
        run: bun run test:unit -- --run --config vitest.ci.config.ts --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: web/coverage/
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
          cache: true
          cache-cancel-in-progress: ${{ github.event_name == 'pull_request' }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare SvelteKit
        run: bunx svelte-kit sync

      - name: Build app
        run: bun run build

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
          cache: true
          cache-cancel-in-progress: ${{ github.event_name == 'pull_request' }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare SvelteKit
        run: bunx svelte-kit sync

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/bun.lock') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Run E2E tests
        run: bun run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14

  # Setup-verification smoke: brings up the full stack via the documented
  # `docker compose up` path (building the web image from the PR's own source),
  # then runs Playwright's setup smoke against it. Verifies that a fresh stack
  # comes up healthy, the prod image's startup.sh applies the declarative schema
  # + RLS, first-user signup works, and the dashboard renders without errors.
  # Kept separate from the fast `e2e` job so public-page tests still gate quickly.
  e2e-setup:
    name: Setup smoke (docker compose up)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
          cache: true
          cache-cancel-in-progress: ${{ github.event_name == 'pull_request' }}

      # Build the prod web image from THIS branch's source (not the published
      # ghcr image) so the test exercises the PR's own code.
      - name: Build Wayli web image
        run: docker build -t wayli-smoke:local -f Dockerfile .

      # Generate secrets non-interactively (writes anon + service-role keys).
      # The keys stay in .smoke.env and are read directly by the steps that
      # need them; they are deliberately NOT written to step outputs (which
      # are exposed in run metadata) or echoed.
      - name: Generate stack secrets
        run: |
          bash deploy/docker-compose/generate-keys.sh --stdout > deploy/docker-compose/.smoke.env
          chmod 600 deploy/docker-compose/.smoke.env

      - name: Bring up the stack
        run: |
          docker compose \
            -f deploy/docker-compose/docker-compose.yml \
            -f deploy/docker-compose/docker-compose.smoke.yml \
            --env-file deploy/docker-compose/.smoke.env \
            up -d --wait

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Prepare SvelteKit
        working-directory: web
        run: bunx svelte-kit sync

      - name: Cache Playwright browsers
        id: playwright-cache-setup
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/bun.lock') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache-setup.outputs.cache-hit != 'true'
        working-directory: web
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache-setup.outputs.cache-hit == 'true'
        working-directory: web
        run: bunx playwright install-deps chromium

      - name: Write web/.env for the smoke
        working-directory: web
        run: |
          ANON_KEY="$(grep '^FLUXBASE_ANON_KEY=' ../deploy/docker-compose/.smoke.env | cut -d= -f2-)"
          SERVICE_KEY="$(grep '^FLUXBASE_SERVICE_ROLE_KEY=' ../deploy/docker-compose/.smoke.env | cut -d= -f2-)"
          {
            echo "FLUXBASE_PUBLIC_BASE_URL=http://localhost:8080"
            echo "PUBLIC_FLUXBASE_ANON_KEY=$ANON_KEY"
            echo "FLUXBASE_ANON_KEY=$ANON_KEY"
            echo "FLUXBASE_SERVICE_ROLE_KEY=$SERVICE_KEY"
          } > .env

      - name: Run setup smoke
        working-directory: web
        env:
          WAYLI_SETUP_PROJECT: '1'
          WAYLI_BASE_URL: http://localhost:4000
          FLUXBASE_PUBLIC_BASE_URL: http://localhost:8080
        # The helpers (confirmEmailIfRequired, wipeUserData) read these from
        # process.env; .env only serves the app, not the Playwright process.
        # Keys are scoped to this step's shell and never echoed.
        run: |
          export FLUXBASE_ANON_KEY="$(grep '^FLUXBASE_ANON_KEY=' ../deploy/docker-compose/.smoke.env | cut -d= -f2-)"
          export PUBLIC_FLUXBASE_ANON_KEY="$FLUXBASE_ANON_KEY"
          export FLUXBASE_SERVICE_ROLE_KEY="$(grep '^FLUXBASE_SERVICE_ROLE_KEY=' ../deploy/docker-compose/.smoke.env | cut -d= -f2-)"
          bun run test:setup

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-setup-report
          path: web/playwright-report/
          retention-days: 14

      - name: Dump stack logs on failure
        if: failure()
        run: |
          docker compose \
            -f deploy/docker-compose/docker-compose.yml \
            -f deploy/docker-compose/docker-compose.smoke.yml \
            --env-file deploy/docker-compose/.smoke.env \
            logs --tail=200 || true

      # ALWAYS tear down: destroy containers, volumes, and the isolated network.
      - name: Tear down the stack
        if: always()
        run: |
          docker compose \
            -f deploy/docker-compose/docker-compose.yml \
            -f deploy/docker-compose/docker-compose.smoke.yml \
            --env-file deploy/docker-compose/.smoke.env \
            down -v --remove-orphans || true
