<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#233869" />
		<script>
			window.WAYLI_CONFIG = {
				fluxbaseUrl: '{{FLUXBASE_PUBLIC_BASE_URL}}',
				fluxbaseAnonKey: '{{FLUXBASE_ANON_KEY}}'
			};
			// Apply the saved theme before first paint to avoid a dark-mode flash (FOUC).
			// The .dark class drives the CSS token overrides in app.css.
			(function () {
				try {
					var stored = localStorage.getItem('theme');
					var prefersDark =
						window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
					var dark = stored ? stored === 'dark' : prefersDark;
					document.documentElement.classList.toggle('dark', dark);
				} catch (e) {
					/* localStorage unavailable; default to light. */
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
